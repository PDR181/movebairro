<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - MoveBairro</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #2563eb;
      font-family: Arial;
    }

    .login-card {

      width: 100%;
      max-width: 400px;

      background: white;

      padding: 30px;

      border-radius: 20px;

      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h1 {
      margin-bottom: 10px;
      color: #2563eb;
    }

    p {
      margin-bottom: 25px;
      color: #666;
    }

    input {

      width: 100%;

      padding: 14px;

      margin-bottom: 15px;

      border: 1px solid #ddd;

      border-radius: 10px;
    }

    button {

      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 10px;

      background: #2563eb;

      color: white;

      font-size: 16px;

      cursor: pointer;
    }

    .register-link {

      margin-top: 20px;

      text-align: center;
    }

    a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

  </style>

</head>

<body>

<div class="login-card">

  <h1>MoveBairro</h1>

  <p>Entre na sua conta</p>

  <input
    type="email"
    id="email"
    placeholder="Email"
  >

  <input
    type="password"
    id="password"
    placeholder="Senha"
  >

  <button onclick="loginUser()">
    Entrar
  </button>

  <div class="register-link">

    Não possui conta?

    <a href="register.html">
      Cadastre-se
    </a>

  </div>

</div>

<script>

async function loginUser() {

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const res = await fetch(
    "http://localhost:3000/users/login",
    {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        email,
        password
      })
    }
  );

  const data = await res.json();

  if (!res.ok) {
    alert(data.message);
    return;
  }

  localStorage.setItem("token", data.token);

  localStorage.setItem("userId", data.user.id);

  localStorage.setItem("userName", data.user.name);

  window.location.href = "index.html";
}

</script>

</body>
</html>
