<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoveBairro</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">

  <!-- MAPA -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial;
      background: #f4f7fb;
    }

    .container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 15px;
    }

    .hero {
      background: #2563eb;
      color: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    button {
      flex: 1;
      min-width: 120px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    .btn-start { background: green; }
    .btn-location { background: blue; }
    .btn-finish { background: red; }
    .btn-history { background: purple; }
    .btn-ranking { background: orange; color: black; }

    .card {
      background: white;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.1s ease;
}

    .card:hover {
      transform: scale(1.02);
}

    .card-header {
      font-weight: bold;
      margin-bottom: 6px;
}

    .card-body {
      color: #555;
}

    .selected {
      border: 2px solid #2563eb;
      background: #eff6ff;
}

    #map {
      width: 100%;
      height: 400px;
      border-radius: 10px;
    }
@media (max-width: 768px) {

  .actions {
    flex-direction: column;
  }

  button {
    width: 100%;
  }

  .container {
    padding: 10px;
  }

  #map {
    height: 300px;
  }

  h1, h3 {
    text-align: center;
  }
}

  </style>
</head>

<body>
<div class="container">

  <div class="hero">
    <h1>MoveBairro</h1>
  </div>

  <div class="card">

    <h3>Login</h3>

    <input
      type="text"
      id="name"
      placeholder="Nome"
      style="width:100%;padding:10px;margin-bottom:10px;"
    >

    <input
      type="email"
      id="email"
      placeholder="Email"
      style="width:100%;padding:10px;margin-bottom:10px;"
    >

    <input
      type="password"
      id="password"
      placeholder="Senha"
      style="width:100%;padding:10px;margin-bottom:10px;"
    >

    <div style="display:flex; gap:10px;">

      <button onclick="registerUser()" style="background:green;">
        Cadastrar
      </button>

      <button onclick="loginUser()" style="background:#2563eb;">
        Login
      </button>

    </div>

  </div>

  <div class="card">
  <input 
    id="username" 
    placeholder="Digite seu nome"
    style="
      width:100%;
      padding:12px;
      border-radius:8px;
      border:1px solid #ccc;
    "
  />
</div>

  <div class="actions">
    <button 
  onclick="setUser()" 
  style="background:#2563eb; color:white;"
>
  Entrar
    </button>
    <button onclick="logout()" style="background:#444;">
  Sair
    </button>
    <button class="btn-start" onclick="startActivity()">Iniciar</button>
    <button class="btn-finish" onclick="finishActivity()">Finalizar</button>
    <button class="btn-history" onclick="loadHistory()">Histórico</button>
    <button class="btn-ranking" onclick="loadRanking()">Ranking</button>
    
  </div>

  <div class="card">
    <b>Status:</b>
    <p id="status">Aguardando...</p>
  </div>

  <!-- MAPA -->
  <div class="card">
    <h3>Mapa</h3>
    <div id="map"></div>
  </div>

  <div class="card">
    <h3>Estatísticas</h3>

    <div id="stats">
      Nenhuma atividade finalizada
    </div>
  </div>  

  <div class="card">
    <h3>Histórico</h3>
    <div id="activitiesList"></div>
  </div>

  <div class="card">
    <h3>Dashboard</h3>

    <canvas id="distanceChart"></canvas>
    <br><br>

    <canvas id="speedChart"></canvas>
  </div>

  <div class="card">
    <h3>Ranking</h3>
    <div id="rankingList"></div>
  </div>

</div>

<script>
let activityId = null;
let watchId = null;
let userId = null;

// MAPA
let map;
let polyline;
let startMarker = null;
let endMarker = null;
let path = [];
let distanceChart = null;
let speedChart = null;

function initMap() {
  map = L.map('map').setView([-21.22, -43.77], 15);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
    .addTo(map);

  polyline = L.polyline([], { color: 'blue' }).addTo(map);
}

initMap();

function setStatus(msg) {
  document.getElementById("status").innerText = msg;
}

async function setUser() {

  const name = document.getElementById("username").value;

  if (!name) {
    alert("Digite seu nome");
    return;
  }

  const email = `${name.toLowerCase()}@movebairro.com`;
  const password = "123456";

  const res = await fetch("http://localhost:3000/users/register", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      name,
      email,
      password
    })
  });

  const data = await res.json();

  console.log(data);

  if (!res.ok) {
    alert(data.message || "Erro ao criar usuário");
    return;
  }

  userId = data.user.id;
  localStorage.setItem("userId", userId);
  localStorage.setItem("userName", name);

  setStatus("Usuário conectado: " + name);
}

async function startActivity() {

  if (!userId) {
  alert("Defina um usuário primeiro");
  return;
}

  const res = await fetch("http://localhost:3000/activities/start", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ userId })
  });

  const data = await res.json();
  activityId = data.activity.id;

  path = [];
  polyline.setLatLngs([]);

  setStatus("Atividade iniciada");

  // 🔥 TRACKING AUTOMÁTICO
  watchId = navigator.geolocation.watchPosition(async (pos) => {

    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;

    const point = [lat, lng];

    // desenha no mapa
    path.push(point);
    polyline.setLatLngs(path);
    map.setView(point, 17);

    await fetch("http://localhost:3000/activities/location", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        activityId,
        latitude: lat,
        longitude: lng
      })
    });

    setStatus("Rastreando atividade...");

  }, (err) => {
    console.error(err);
    setStatus("Erro ao obter localização");
  }, {
    enableHighAccuracy: true,
    maximumAge: 0,
    timeout: 5000
  });
}

async function finishActivity() {

  // 🛑 PARAR TRACKING
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }

  await fetch("http://localhost:3000/activities/finish", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ activityId })
  });

  activityId = null;
  setStatus("Finalizado");
}

function formatDistance(meters) {
  if (!meters) return "0 km";
  return (meters / 1000).toFixed(2) + " km";
}

function formatDuration(seconds) {
  if (!seconds) return "Em andamento";

  const min = Math.floor(seconds / 60);
  const sec = seconds % 60;

  return `${min}m ${sec}s`;
}

async function loadHistory() {
  const res = await fetch("http://localhost:3000/activities");
  const data = await res.json();

  const div = document.getElementById("activitiesList");

  div.innerHTML = data.map(a => `
    <div id="activity-${a.id}" onclick="viewActivity(${a.id})" class="card">
    
      <div class="card-header">
        🏃 Atividade ${a.id}
      </div>

      <div class="card-body">
        <div>📏 ${formatDistance(a.distance)}</div>
        <div>⏱ ${formatDuration(a.duration)}</div>
      </div>

    </div>
  `).join("");

  renderChart(data);
}

async function loadRanking() {
  const res = await fetch("http://localhost:3000/activities/ranking");
  const data = await res.json();

  const div = document.getElementById("rankingList");

  div.innerHTML = data.map((r, i) => `
    <div class="card">
      
      <div class="card-header">
        🥇 #${i + 1}
      </div>

      <div class="card-body">
        👤 ${r.name}<br>
        📏 ${formatDistance(r.total_distance)}
      </div>

    </div>
  `).join("");
}

async function viewActivity(id) {

  // limpar seleção visual
  document.querySelectorAll(".card").forEach(c => c.classList.remove("selected"));
  const selected = document.getElementById(`activity-${id}`);
  if (selected) selected.classList.add("selected");

  // limpar mapa
  polyline.setLatLngs([]);

  if (startMarker) map.removeLayer(startMarker);
  if (endMarker) map.removeLayer(endMarker);

  const res = await fetch(`http://localhost:3000/activities/${id}/coordinates`);
  const coords = await res.json();

  if (!coords.length) {
    alert("Sem coordenadas");
    return;
  }

  const path = coords.map(c => [c.latitude, c.longitude]);

  // desenhar linha
  polyline.setLatLngs(path);

  // 📍 início
  startMarker = L.marker(path[0])
    .addTo(map)
    .bindPopup("Início");

  // 🏁 fim
  endMarker = L.marker(path[path.length - 1])
    .addTo(map)
    .bindPopup("Fim");

  // zoom automático
  map.fitBounds(path);

  setStatus("Visualizando atividade " + id);
}
window.onload = () => {

  const savedUserId = localStorage.getItem("userId");
  const savedUserName = localStorage.getItem("userName");

  if (savedUserId && savedUserName) {

    userId = savedUserId;

    document.getElementById("username").value = savedUserName;

    setStatus("Usuário conectado: " + savedUserName);
  }
};

function logout() {

  localStorage.removeItem("userId");
  localStorage.removeItem("userName");

  userId = null;

  document.getElementById("username").value = "";

  setStatus("Usuário desconectado");

  alert("Logout realizado");
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}

function renderChart(data) {

  const labels = data.map(a => `Atividade ${a.id}`);

  const distances = data.map(a =>
    (a.distance / 1000).toFixed(2)
  );

  const speeds = data.map(a => {

    if (!a.duration || a.duration <= 0) {
      return 0;
    }

    const hours = a.duration / 3600;

    return ((a.distance / 1000) / hours).toFixed(2);
  });

  // =========================
  // GRÁFICO DISTÂNCIA
  // =========================

  const ctxDistance = document.getElementById("distanceChart");

  if (distanceChart) {
    distanceChart.destroy();
  }

  distanceChart = new Chart(ctxDistance, {

    type: "bar",

    data: {
      labels,

      datasets: [{
        label: "Distância (km)",
        data: distances
      }]
    },

    options: {
      responsive: true
    }
  });

  // =========================
  // GRÁFICO VELOCIDADE
  // =========================

  const ctxSpeed = document.getElementById("speedChart");

  if (speedChart) {
    speedChart.destroy();
  }

  speedChart = new Chart(ctxSpeed, {

    type: "line",

    data: {
      labels,

      datasets: [{
        label: "Velocidade Média (km/h)",
        data: speeds
      }]
    },

    options: {
      responsive: true
    }
  });
}

async function registerUser() {

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch("http://localhost:3000/users/register", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({
      name,
      email,
      password
    })
  });

  const data = await res.json();

  alert(data.message);
}

async function loginUser() {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch("http://localhost:3000/users/login", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({
      email,
      password
    })
  });

  const data = await res.json();

  if (!res.ok) {
    alert(data.message);
    return;
  }

  localStorage.setItem("token", data.token);

  localStorage.setItem("userId", data.user.id);

  localStorage.setItem("userName", data.user.name);

  userId = data.user.id;

  setStatus("Logado como " + data.user.name);

  alert("Login realizado");
}

</script>

</body>
</html>
